      - --loglevel=info
      - -Q
      - desktop_discussion
      - --prefetch-multiplier=1
      - --concurrency=${STACK0_CELERY_DISCUSSION_CONCURRENCY:-2}
      - --hostname=discussion-worker@%h
      - --max-tasks-per-child=100
      - --time-limit=600
      - --soft-time-limit=540
    env_file:
      - ../env_file/.env.stack0.shared
      - ../env_file/.env.stack0.jobs
    networks:
      - ew_net_6211
      - ew_net_2847
      - ew_net_9O11
      - ew_net_4532
      - ew_net_7198
      - ew_net_3365
      - ew_net_5402
    security_opt:
      - no-new-privileges:true
      - label=level:s0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    user: "${STACK0_USER:?STACK0_USER not set}"
    volumes:
      - ../../shared/api:/app/api:ro,z
      - ../../host/comfyui:/app/comfyui:ro,z
      - ../../host/generated_files:/app/generated_files:z
      - ../logs/stack0/eliteew-celery-discussion-worker-prod:/logs:z
    environment:
      - TZ=Asia/Vladivostok
      - ELITEEW_LOG_FILE=/logs/eliteew-celery-discussion-worker.log
      - ELITEEW_LOG_LEVEL=${ELITEEW_LOG_LEVEL:-INFO}
      - PYTHONUNBUFFERED=1
      # Same broker/backend as eliteew-api-prod (CELERY_REDIS_DB from env_file)
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@${REDIS_HOST}:${REDIS_PORT}/${CELERY_REDIS_DB}
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@${REDIS_HOST}:${REDIS_PORT}/${CELERY_REDIS_DB}
      - CELERY_WORKER_PREFETCH_MULTIPLIER=${CELERY_WORKER_PREFETCH_MULTIPLIER:-1}
      - CELERY_REDIS_VISIBILITY_TIMEOUT=${CELERY_REDIS_VISIBILITY_TIMEOUT:-3600}
      - POSTGRES_EXTERNAL_PORT=30000
      - REDIS_EXTERNAL_PORT=30001
      # Celery autodiscover imports agentic/tasks → DatabaseConfig requires these ports
      - ELASTICSEARCH_EXTERNAL_PORT=30007
      - CHROMADB_CONTAINER_NAME=${CHROMADB_CONTAINER_NAME:-stack1-chroma}
      - CHROMADB_HOST=${CHROMADB_HOST:-stack1-chroma}
      - CHROMADB_EXTERNAL_HOST=${CHROMADB_EXTERNAL_HOST:-127.0.0.1}
      - CHROMADB_PORT=${CHROMADB_PORT:-8000}
      - CHROMADB_EXTERNAL_PORT=${CHROMADB_EXTERNAL_PORT:-30002}
      - MINIO_HOST=${MINIO_HOST:-stack1-seaweedfs}
      - MINIO_PORT=${MINIO_PORT:-8333}
      - MINIO_EXTERNAL_PORT=${MINIO_EXTERNAL_PORT:-30006}
      - MINIO_CONSOLE_PORT=${MINIO_CONSOLE_PORT:-30005}
      - RABBITMQ_CONTAINER_NAME=${RABBITMQ_CONTAINER_NAME:-stack1-rabbitmq}
      - RABBITMQ_HOST=${RABBITMQ_HOST:-stack1-rabbitmq}
      - RABBITMQ_EXTERNAL_HOST=${RABBITMQ_EXTERNAL_HOST:-127.0.0.1}
      - RABBITMQ_PORT=${RABBITMQ_PORT:-5672}
      - RABBITMQ_EXTERNAL_PORT=${RABBITMQ_EXTERNAL_PORT:-30008}
      - RABBITMQ_MANAGEMENT_PORT=${RABBITMQ_MANAGEMENT_PORT:-30009}
      - RABBITMQ_MANAGEMENT_INTERNAL_PORT=${RABBITMQ_MANAGEMENT_INTERNAL_PORT:-15672}
      - RABBITMQ_VHOST=${RABBITMQ_VHOST:-/}
      - RABBITMQ_HEARTBEAT=${RABBITMQ_HEARTBEAT:-60}
      - RABBITMQ_BLOCKED_CONNECTION_TIMEOUT=${RABBITMQ_BLOCKED_CONNECTION_TIMEOUT:-300}
      - QDRANT_CONTAINER_NAME=${QDRANT_CONTAINER_NAME:-stack1-qdrant}
      - QDRANT_HOST=${QDRANT_HOST:-stack1-qdrant}
      - QDRANT_EXTERNAL_HOST=${QDRANT_EXTERNAL_HOST:-127.0.0.1}
      - QDRANT_PORT=${QDRANT_PORT:-6333}
      - QDRANT_EXTERNAL_PORT=${QDRANT_EXTERNAL_PORT:-30003}
      - QDRANT_GRPC_PORT=${QDRANT_GRPC_PORT:-6334}
      - COMFYUI_URL=${COMFYUI_URL}
      - GENERATED_FILES_BASE=${GENERATED_FILES_BASE}
    restart: unless-stopped
    # Process liveness only (cheap). Do NOT use celery inspect ping here — cold import +
    # broker broadcast hammers CPU on a short interval. Deep check: Admin Workers / acceptance.
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f '[c]elery.*worker' >/dev/null || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s

  # Ровно один экземпляр beat (иначе периодические задачи дублируются).
  eliteew-celery-beat-prod:
