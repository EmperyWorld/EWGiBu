  services:
    chroma:
      command:
        - run
        - --path
        - /chroma/data
        - --host
        - 0.0.0.0
        - --port
        - "8000"
      environment:
        CHROMA_DB_PATH:
          literal: /chroma/data
        CHROMA_SERVER_HOST:
          literal: 0.0.0.0
        CHROMA_SERVER_HTTP_PORT:
          literal: 8000
        IS_PERSISTENT:
          literal: "TRUE"
        PERSIST_DIRECTORY:
          literal: /chroma/data
        TZ:
          literal: Asia/Vladivostok
      healthcheck:
        command:
          - /bin/sh
          - -c
          - bash -c 'exec 3<>/dev/tcp/127.0.0.1/8000'
        interval: 30s
        retries: 5
        startPeriod: 40s
        timeout: 10s
      image: chroma
      mounts:
        - readOnly: false
          resource: res-chroma-chroma
          target: /chroma/data
        - readOnly: false
          resource: res-chroma-chroma
          target: /logs
        - readOnly: true
          resource: res-chroma-uvicorn-log-configyaml
          source: uvicorn-log-config.yaml
          target: /etc/uvicorn-log-config.yaml
      networks:
        - ew-net-2847
      ports:
        - bind: 127.0.0.1
          container: 8000
          host:
            parameter: chroma-host-port
      resources:
        cpus: "2"
        memory: 8589934592
      restart: unless-stopped
    elasticsearch:
      environment:
        ES_JAVA_OPTS:
          literal: -Xms2g -Xmx2g -Djava.locale.providers=CLDR,COMPAT,SPI
        ES_LOG_STYLE:
          literal: file
        TZ:
          literal: Asia/Vladivostok
        discovery.type:
          literal: single-node
        http.host:
          literal: 0.0.0.0
        logger.level:
          literal: INFO
        network.host:
          literal: 0.0.0.0
        xpack.security.enabled:
          literal: "false"
      healthcheck:
        command:
          - /bin/sh
          - -c
          - curl -f http://localhost:9200/_cluster/health || exit 1
        interval: 30s
        retries: 5
        startPeriod: 60s
        timeout: 10s
      image: elasticsearch
      mounts:
        - readOnly: false
          resource: res-elasticsearch-elasticsearch
          target: /usr/share/elasticsearch/data
        - readOnly: true
          resource: res-elasticsearch-elasticsearchyml
          source: elasticsearch.yml
          target: /usr/share/elasticsearch/config/elasticsearch.yml
        - readOnly: true
          resource: res-elasticsearch-jvmoptions
          source: jvm.options
          target: /usr/share/elasticsearch/config/jvm.options
        - readOnly: false
          resource: res-elasticsearch-elasticsearch
          target: /logs
      networks:
        - ew-net-2847
      ports:
        - bind: 127.0.0.1
          container: 9200
          host:
            parameter: elasticsearch-host-port
      resources:
        cpus: "2"
        memory: 8589934592
      restart: unless-stopped
      user: 1000:1000
